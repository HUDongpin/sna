name: release-containers

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main branch commit SHA to release
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Guard exact SHA
        run: |
          [[ "${{ inputs.release_sha }}" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main --depth=1
          test "$(git rev-parse --verify HEAD)" = "${{ inputs.release_sha }}"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push web image
        uses: docker/build-push-action@v6
        id: web_build
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VCS_REF=${{ inputs.release_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.release_sha }}
          tags: ghcr.io/hudongpin/sna-web:${{ inputs.release_sha }}
      - name: Build and push worker image
        uses: docker/build-push-action@v6
        id: worker_build
        with:
          context: .
          file: Dockerfile.open-sna-worker
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VCS_REF=${{ inputs.release_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.release_sha }}
          tags: ghcr.io/hudongpin/sna-worker:${{ inputs.release_sha }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign images
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ghcr.io/hudongpin/sna-web@${{ steps.web_build.outputs.digest }}
          cosign sign --yes ghcr.io/hudongpin/sna-worker@${{ steps.worker_build.outputs.digest }}
